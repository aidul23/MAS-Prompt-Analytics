# Template: the nginx image fills in ${LISTEN}, ${API_UPSTREAM} and ${AUTH_BASIC} from the environment at start.
server {
    listen ${LISTEN};
    root /usr/share/nginx/html;

    # AUTH_BASIC=off (default) or a realm name; with a realm, mount an htpasswd file at this path.
    auth_basic "${AUTH_BASIC}";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    # Trace exports can be large.
    client_max_body_size 500m;

    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Multi-agent answers take 10-20 s, and much longer while Ollama loads a model.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/chat/<id>, /data, /models) all load the app.
    location / {
        try_files $uri /index.html;
    }
}
